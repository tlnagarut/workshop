# ============================================================================
# Photos on the site. Your ORIGINAL photos stay outside the site folder, in
#   ~/dev/tl-nagarut-photos/<group>/        (e.g. ~/dev/tl-nagarut-photos/spray/)
# and are never changed. ./build.sh makes the web versions automatically:
# rotated upright, cropped to the shape below, resized (480–1600 px, WebP +
# JPEG, each under ~300 KB) and saved in assets/img/photos/. No filters.
#
# Groups (one per place on the site):
#   hero      the big banner at the top of the home page — cropped 16:9.
#             Only the first photo is used. Leave empty for the plain banner.
#   workshop  gallery on the Workshop page — cropped 4:3
#   spray     gallery in the "Spray finishing" section — cropped 4:3
#   process   the "In the workshop" page: raw, unedited process photos — 4:3
#
# For each photo:
#   file:        the original's file name inside its group folder
#   name:        descriptive web file name — lowercase words with dashes,
#                saying what it shows (e.g. raptor-spray-booth-glass-doors)
#   alt_en / alt_he:          what the photo shows, for screen readers & Google
#   caption_en / caption_he:  short caption shown when the photo is opened
#   focus:       optional — which part to keep when cropping: attention
#                (default: finds the main subject), centre, top, bottom,
#                left or right
#
# Example (remove the # signs to use it):
#   spray:
#     - file: IMG_2041.HEIC
#       name: raptor-spray-booth-glass-doors
#       alt_en: Raptor downdraft spray booth with glass double doors
#       alt_he: תא צביעה Raptor עם דלתות זכוכית כפולות
#       caption_en: Our Raptor downdraft spray booth
#       caption_he: תא הצביעה Raptor שלנו
# ============================================================================

