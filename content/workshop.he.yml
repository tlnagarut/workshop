eyebrow: הנגרייה
title: הנגרייה שלנו בחיפה
intro: >
  הכול מיוצר כאן, בנגרייה שלנו ברחוב אריה שנקר בחיפה – תכנון, חיתוך, הרכבה וגימור בהתזה – ומותקן על ידינו.

equipmentTitle: ציוד
equipment:
  - title: מכונת CNC לחיתוך לוחות (Nesting) Busellato Jet Optima RT21A
    description: >
      חותכת, מכרסמת וקודחת את לוחות הארונות ישר מהשרטוט.
  - title: חדר מכונות
    description: >
      מסור פאנל, מקצועת עובי, מקצועה, מסור סרט ושולחן פרזה לעיבוד מדויק וחוזר של עץ מלא ולוחות.
  - title: מכונת קנטים SCM Minimax
    description: >
      מדביקה קנטים ללוחות הארונות, כאן בנגרייה.
  - title: מערכות פרזול Blum
    description: >
      מערכות מגירות ופרזול של Blum, המותקנות בארונות שלנו.
  - title: מערכת התזה Fuji D6 HVLP
    description: >
      מערכת טורבינה HVLP בת שישה שלבים לגימור בהתזה.
  - title: תא צביעה Raptor עם יניקה כלפי מטה
    description: >
      תא צביעה סגור עם זרימת אוויר מסוננת מהתקרה אל הרצפה.

spray:
  title: גימור בהתזה
  lede: צובעים אצלנו. מההתחלה ועד הסוף.
  points:
    - תא צביעה Raptor עם יניקה כלפי מטה – דלתות זכוכית כפולות, רצפת סבכה ליניקה כלפי מטה, לוח בקרה דיגיטלי וזרימת אוויר מסוננת מהתקרה אל הרצפה.
    - מערכת טורבינה Fuji D6 HVLP בת שישה שלבים.
    - ציפויי פוליאוריתן דו-רכיביים (2K), המיושמים ומתייבשים בסביבה מבוקרת.
  cta: שאלו אותנו על גימורים

# חיתוך CNC (דף הנגרייה ורצועה בדף הבית).
cnc:
  eyebrow: חיתוך CNC
  title: חיתוך CNC, בנגרייה שלנו
  lede: >
    מכונת ה-CNC שלנו לחיתוך לוחות (Nesting), Busellato Jet Optima RT21A, חותכת, מכרסמת וקודחת לוחות ישר מהשרטוט – לרהיטים שלנו, וגם כשירות לנגרים, למעצבים ולקבלנים.
  points:
    - title: נסטינג
      text: כל חלקי הארון מסודרים על הלוח ונחתכים במהלך אחד, במדויק ועם מעט פחת.
    - title: כרסום
      text: קשתות, פתחים, חריצים וחלקים בצורות מיוחדות – לוחות פסים ולוחות מחורצים, חיפויי קיר ודלתות מחורצות.
    - title: קידוח
      text: קידוחים לצירים, לנושאי מדפים ולפרזול, באותו מהלך – כך שהכול מתיישב במקום.
    - title: מהשרטוט שלכם
      text: שלחו קובץ DXF או רשימת חיתוך. גם סקיצה או תמונה עם מידות מספיקה – אנחנו מכינים את השרטוט.
  tradeTitle: לנגרים, למעצבים ולקבלנים
  tradeBody: >
    שלחו לנו רשימת חיתוך או שרטוטים וקבלו חלקים חתוכים, קדוחים ומוכנים להרכבה. הדבקת קנטים וצביעה בהתזה נעשות באותה נגרייה, אם צריך. איסוף בחיפה, או משלוח בחיפה ובצפון.
  cta: הצעת מחיר ל-CNC בוואטסאפ
  message: שלום, אשמח לקבל הצעת מחיר לחיתוך CNC. אשלח שרטוט או רשימת חיתוך.
  more: עוד על ה-CNC שלנו
