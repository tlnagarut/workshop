# ============================================================================
# Workshop page — English text. Same keys in workshop.he.yml.
# After editing, run:  ./build.sh
#
# "equipment" is a list of cards — add, remove or reorder freely. Each card has
# a "title" and a "description"; keep the "- " in front of each card's title.
# "spray.points" is a list of short facts, one per line starting with "- ".
# Photos for this page are listed in content/photos.yml (groups "workshop"
# and "spray").
# ============================================================================

eyebrow: The workshop
title: Our workshop in Haifa
intro: >
  Everything is made here, in our workshop on Arye Shenkar Street in Haifa —
  design, cutting, assembly and spray finishing — and then installed by us.

equipmentTitle: Equipment
equipment:
  - title: Busellato Jet Optima RT21A CNC nesting machine
    description: >
      Cuts, routes and drills cabinet panels straight from the drawing.
  - title: Machine room
    description: >
      Panel saw, thicknesser, planer, bandsaw and router table for accurate,
      repeatable milling of solid timber and sheet goods.
  - title: SCM Minimax edgebander
    description: >
      Applies edge banding to cabinet panels, here in the workshop.
  - title: Blum hardware systems
    description: >
      Blum drawer systems and fittings, fitted to our cabinets.
  - title: Fuji D6 HVLP spray system
    description: >
      A six-stage HVLP turbine system for spray finishing.
  - title: Raptor downdraft spray booth
    description: >
      An enclosed spray booth with filtered airflow from ceiling to floor.

spray:
  title: Spray finishing
  lede: Sprayed in-house. Start to finish.
  points:
    - Raptor downdraft spray booth with glass double doors, a downdraft grated floor, a digital control panel and filtered airflow from ceiling to floor.
    - Fuji D6 6-stage HVLP turbine system.
    - 2K polyurethane coatings, applied and cured in a controlled environment.
  cta: Ask us about finishes

# CNC section (Workshop page and a band on the home page).
# points: the capability cards. message: the WhatsApp text of the quote button.
cnc:
  eyebrow: CNC cutting
  title: CNC cutting, in our own workshop
  lede: >
    Our Busellato Jet Optima RT21A CNC nesting machine cuts, routes and drills
    panels straight from a drawing — for our own furniture, and as a service
    for carpenters, designers and contractors.
  points:
    - title: Nesting
      text: All the parts of a cabinet are laid out on the sheet and cut in one run, accurately and with little waste.
    - title: Routing
      text: Curves, cut-outs, grooves and shaped parts — slatted and fluted panels, wall cladding, grooved doors.
    - title: Drilling
      text: Holes for hinges, shelf supports and fittings, drilled in the same run so everything lines up.
    - title: From your drawing
      text: Send a DXF file or a cutting list. A sketch or a photo with sizes works too — we prepare the drawing.
  tradeTitle: For carpenters, designers and contractors
  tradeBody: >
    Send us your cutting list or drawings and get your parts back cut, drilled
    and ready to assemble. Edge banding and spray finishing are done in the
    same workshop if you need them. Pick-up in Haifa, or delivery across Haifa
    and the north.
  cta: Get a CNC quote on WhatsApp
  message: Hi, I'd like a quote for CNC cutting. I'll send a drawing or a cutting list.
  more: More about our CNC
