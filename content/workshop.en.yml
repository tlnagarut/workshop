# ============================================================================
# Workshop page — English text. Same keys in workshop.he.yml.
# After editing, run:  ./build.sh
#
# "equipment" is a list of cards — add, remove or reorder freely. Each card has
# a "title" and a "description"; keep the "- " in front of each card's title.
# "spray.points" is a list of short facts, one per line starting with "- ".
# Photos for this page are listed in content/photos.yml (groups "workshop"
# and "spray").
# ============================================================================

eyebrow: The workshop
title: Our workshop in Haifa
intro: >
  Everything is made here, in our workshop on Arye Shenkar Street in Haifa —
  design, cutting, assembly and spray finishing — and then installed by us.

equipmentTitle: Equipment
equipment:
  - title: Machine room
    description: >
      Panel saw, thicknesser, planer, bandsaw and router table for accurate,
      repeatable milling of solid timber and sheet goods.
  - title: SCM Minimax edgebander
    description: >
      Applies edge banding to cabinet panels, here in the workshop.
  - title: Blum hardware systems
    description: >
      Blum drawer systems and fittings, fitted to our cabinets.
  - title: Fuji D6 HVLP spray system
    description: >
      A six-stage HVLP turbine system for spray finishing.
  - title: Raptor downdraft spray booth
    description: >
      An enclosed spray booth with filtered airflow from ceiling to floor.
  - title: Busellato Jet Optima RT CNC nesting machine — arriving soon
    description: >
      Purchased for the workshop and not yet installed.

spray:
  title: Spray finishing
  lede: Sprayed in-house. Start to finish.
  points:
    - Raptor downdraft spray booth with glass double doors, a downdraft grated floor, a digital control panel and filtered airflow from ceiling to floor.
    - Fuji D6 6-stage HVLP turbine system.
    - 2K polyurethane coatings, applied and cured in a controlled environment.
  cta: Ask us about finishes
