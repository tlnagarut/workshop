eyebrow: Мастерская
title: Наша мастерская в Хайфе
intro: >
  Всё делается здесь, в нашей мастерской на улице Арье Шенкар в Хайфе —
  проектирование, раскрой, сборка и покраска распылением. Устанавливаем тоже
  мы сами.

equipmentTitle: Оборудование
equipment:
  - title: Раскроечный центр с ЧПУ Busellato Jet Optima RT21A
    description: >
      Режет, фрезерует и сверлит мебельные плиты прямо по чертежу.
  - title: Станочный цех
    description: >
      Форматно-раскроечный станок, рейсмус, фуганок, ленточная пила и
      фрезерный стол для точной и повторяемой обработки массива и плитных
      материалов.
  - title: Кромкооблицовочный станок SCM Minimax
    description: >
      Наклеивает кромку на мебельные панели, здесь, в мастерской.
  - title: Фурнитура Blum
    description: >
      Системы ящиков и фурнитура Blum в наших шкафах.
  - title: Покрасочная система Fuji D6 HVLP
    description: >
      Шестиступенчатая турбинная HVLP-система для покраски распылением.
  - title: Покрасочная камера Raptor с нижней вытяжкой
    description: >
      Закрытая камера с фильтрованным потоком воздуха от потолка к полу.

spray:
  title: Покраска распылением
  lede: Красим сами. От начала до конца.
  points:
    - Покрасочная камера Raptor с нижней вытяжкой, двойными стеклянными дверями, решётчатым полом, цифровой панелью управления и фильтрованным потоком воздуха от потолка к полу.
    - Шестиступенчатая турбинная HVLP-система Fuji D6.
    - Двухкомпонентные полиуретановые покрытия (2K), которые наносятся и сохнут в контролируемых условиях.
  cta: Спросите нас о покрытиях

# Раскрой на ЧПУ (страница мастерской и блок на главной).
cnc:
  eyebrow: Раскрой на ЧПУ
  title: Раскрой на ЧПУ в нашей мастерской
  lede: >
    Наш раскроечный центр с ЧПУ Busellato Jet Optima RT21A (нестинг) режет,
    фрезерует и сверлит плиты прямо по чертежу — для нашей мебели и как
    услуга для столяров, дизайнеров и подрядчиков.
  points:
    - title: Нестинг
      text: Все детали шкафа раскладываются на листе и вырезаются за один проход, точно и с минимумом отходов.
    - title: Фрезеровка
      text: Радиусы, вырезы, пазы и фигурные детали — реечные и рифлёные панели, стеновые панели, фасады с пазами.
    - title: Сверление
      text: Отверстия под петли, полкодержатели и фурнитуру сверлятся в том же проходе, поэтому всё совпадает.
    - title: По вашему чертежу
      text: Пришлите файл DXF или карту раскроя. Подойдёт и эскиз или фото с размерами — чертёж подготовим мы.
  tradeTitle: Столярам, дизайнерам и подрядчикам
  tradeBody: >
    Пришлите карту раскроя или чертежи и получите детали, раскроенные,
    просверленные и готовые к сборке. Кромкование и покраска распылением —
    в той же мастерской, если нужно. Самовывоз в Хайфе или доставка по Хайфе
    и северу страны.
  cta: Расчёт стоимости ЧПУ в WhatsApp
  message: Здравствуйте! Хочу узнать стоимость раскроя на ЧПУ. Пришлю чертёж или карту раскроя.
  more: Подробнее о нашем ЧПУ
