# ============================================================================
# Contact details — shared across BOTH languages. Edit here once.
# This file is the single source of truth: the Contact section, the footer and
# the Google business data (structured data) are all built from it.
# After editing, run:  ./build.sh
# ============================================================================

# Two contact people — both are shown, each with its own WhatsApp button.
# phoneDisplay = what's shown on the page.  phoneHref = dialable, with country
# code (e.g. +972...). The people's NAMES live in about.en.yml / about.he.yml
# under "contact" (person1Name / person2Name) so they can be translated.
# The first number is the main business number given to Google.
people:
  - phoneDisplay: "053-382-2875"
    phoneHref: "+972533822875"
  - phoneDisplay: "052-369-9346"
    phoneHref: "+972523699346"

# Who answers visitors in each language: 1 = the first person above (Tomas),
# 2 = the second (Lina). The WhatsApp and call buttons on each language's
# pages go to that person.
answers:
  en: 1
  he: 2
  ru: 1

email: "tlnagarut@outlook.com"

# Owner's name, given to Google as the business founder.
founder: Tomas Janulionis

# Workshop address, in English, Hebrew and Russian.
address:
  streetEn: Arye Shenkar Street 35
  streetHe: רחוב אריה שנקר 35
  streetRu: ул. Арье Шенкар, 35
  cityEn: Haifa
  cityHe: חיפה
  cityRu: Хайфа
  countryEn: Israel
  countryHe: ישראל
  countryRu: Израиль
  countryCode: IL

instagram: "https://www.instagram.com/tlnagarut/"
instagramHandle: "@tlnagarut"

# The site's public web address (used for links shared on social media, for
# Google, sitemap.xml and robots.txt). Keep the slash at the end.
siteUrl: "https://tlnagarut.co.il/"
