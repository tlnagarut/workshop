# ============================================================================
# Home page photos — shared by all three languages. After editing, run:
#   ./build.sh
#
# Every photo here comes from a project folder in assets/projects/<project>/
# (hero, cards, gallery) or from the "process" group in content/photos.yml
# (strip). The words that go with them live in about.en.yml / about.he.yml /
# about.ru.yml under "home".
#
# cards:   the eight "What we make" photo cards, in the same order as
#          home.cards in the text files. size: big / wide / tall / normal.
# gallery: the tiles under "Recent work". type decides which filter button
#          shows the tile: kitchens / closets / furniture / commercial.
#          Tapping a tile opens that project on the Projects page.
# strip:   the moving row of workshop photos (names from content/photos.yml).
# ============================================================================

