about:
  eyebrow: About
  title: Hello, I'm Tomas.
  p1: >
    TLnagarut is a custom cabinetry and solid wood door workshop in Haifa, led
    by Tomas, with 25 years in the trade.
  p2: >
    We make custom cabinets and kitchens, built-in furniture and solid wood
    doors, and we also do commercial work. Everything is made in our own
    workshop — design, cutting, assembly and spray finishing — and we deliver
    and install it ourselves, across Haifa and the north.
  p3: >
    Tomas trained on demanding residential and commercial projects in the UK.
  stat1Value: "25"
