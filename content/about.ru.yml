about:
  eyebrow: О нас
  title: Здравствуйте, я Томас.
  p1: >
    TLnagarut — мастерская корпусной мебели и дверей из массива на заказ в
    Хайфе. Ею руководит Томас, у которого 25 лет опыта в профессии.
  p2: >
    Мы делаем шкафы и кухни на заказ, встроенную мебель и двери из массива, а
    также берём коммерческие заказы. Всё изготавливается в нашей собственной
    мастерской — проектирование, раскрой, сборка и покраска распылением.
    Доставляем и устанавливаем сами, по Хайфе и северу страны.
  p3: >
    Томас учился ремеслу на сложных жилых и коммерческих проектах в
    Великобритании.
  stat1Value: "25"
  stat1Label: лет в профессии
  stat2Value: На заказ
