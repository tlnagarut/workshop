# Rebuilds the pages from templates/ + content/ and deploys to GitHub Pages.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let only one deploy run at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4

      # Rebuild the pages from templates/ + content/ (mirrors build.sh):
      # English pages in the root, Hebrew pages in he/, and sitemap.xml.
      # Photos and the social image are processed locally and committed, so
      # process-photos / generate-placeholders don't run here. TZ pins the
      # footer "last updated" stamp to Israel time, matching local builds.
      - run: node tools/build-pages.mjs
        env:
          TZ: Asia/Jerusalem

      # Stamp cache-busting ?v=<hash> (root and he/ pages) so the deployed HTML
      # matches the freshly built assets, even if the committed HTML wasn't
      # re-stamped locally.
      - run: node tools/stamp-versions.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
